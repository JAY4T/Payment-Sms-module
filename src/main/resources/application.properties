spring.application.name=paymentsms

spring.datasource.url=jdbc:postgresql://${DB_ADDRESS}:5432/${DB_NAME}?serverTimezone=Africa/Nairobi
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=baseline
# Explicit rather than relying on the default: a checksum mismatch (someone editing an
# already-applied migration like V1) must stop the deploy instead of being skipped silently.
spring.flyway.validate-on-migrate=true

jwt.secret=${JWT_SECRET}
jwt.access-token.expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
jwt.refresh-token.expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

admin.api.key=${ADMIN_API_KEY}

intasend.mpesa.checkout.url=${INTASEND_MPESA_CHECKOUT_URL}
intasend.checkout.url=${INTASEND_CHECKOUT_URL}
intasend.payment.status.url=${INTASEND_PAYMENT_STATUS_URL}
intasend.sendmoney.url=${INTASEND_SENDMONEY_URL}
intasend.sendmoney.approval.url=${INTASEND_SENDMONEY_APPROVAL_URL}
intasend.sendmoney.status.url=${INTASEND_SENDMONEY_STATUS_URL}
intasend.wallet.url=${INTASEND_WALLET_URL}
intasend.bank.codes.url=${INTASEND_BANK_CODES_URL:https://api.intasend.com/api/v1/send-money/bank-codes/KE/}
intasend.secret.key=${INTASEND_SECRET_KEY}
intasend.public.key=${INTASEND_PUBLIC_KEY}

# Who bears the Intasend transaction cost when a checkout doesn't name its own tarrif.
# BUSINESS-PAYS = the collecting business (LigiOpen) absorbs the gateway fee out of its proceeds;
# CUSTOMER-PAYS = the fee is added to what the customer pays. Callers may override per checkout by
# sending "tarrif" on the checkout request, which is how LigiOpen exposes this as a business choice.
intasend.tarrif.default=${INTASEND_TARRIF_DEFAULT:BUSINESS-PAYS}

# Per-shortcode partner ID + API key now live in the celcom_senders table, managed via
# /api/v1/admin/celcom-senders - only the shared gateway URL stays as an env var.
celcom.sms.url=${CELCOM_SMS_URL}

# Transactional outbox relay (see OutboxRelayService / V7__transactional_outbox.sql).
# Events are written to outbox_events in the same transaction as the status change and published
# from there, so a RabbitMQ outage delays settlement notification instead of losing it.
outbox.relay.enabled=${OUTBOX_RELAY_ENABLED:true}
outbox.relay.interval=${OUTBOX_RELAY_INTERVAL:15000}

# Upper bound on rows per reconciliation sweep (reconcilePendingSendMoneyBatches,
# reconcilePendingCollectionTransactions, updatePendingClearingStatuses). The sweeps are ordered
# oldest-first, so a backlog larger than this drains over consecutive runs instead of becoming one
# unbounded burst of provider calls.
reconciliation.sweep.batch-size=${RECONCILIATION_SWEEP_BATCH_SIZE:500}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}

# Jackson Configuration - Preserve field declaration order
spring.jackson.mapper.sort-properties-alphabetically=false

